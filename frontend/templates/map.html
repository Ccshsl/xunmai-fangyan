{% extends "base.html" %}
{% block title %}寻脉 - 方言分布地图{% endblock %}
{% block head_styles %}
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        :root {
            --primary-blue: #1e40af;
            --secondary-blue: #3b82f6;
            --cyan-glow: #06b6d4;
            --teal-green: #14b8a6;
            --mint-green: #10b981;
            --primary-green: #059669;
            --light-blue: #e0f2fe;
            --light-green: #d1fae5;
            --gradient-start: #1e40af;
            --gradient-mid: #06b6d4;
            --gradient-end: #059669;
            --text-dark: #0f172a;
            --text-light: #475569;
            --text-white: rgba(255, 255, 255, 0.9);
        }

        body {
            font-family: 'Noto Serif SC', 'Microsoft YaHei', 'PingFang SC', serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-mid) 40%, var(--gradient-end) 100%);
            position: relative;
            min-height: 100vh;
        }

        /* 动态渐变背景动画 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                135deg,
                var(--gradient-start) 0%,
                var(--gradient-mid) 30%,
                var(--teal-green) 60%,
                var(--gradient-end) 100%
            );
            background-size: 200% 200%;
            animation: gradientShift 15s ease infinite;
            pointer-events: none;
            z-index: -2;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 动态光效层 */
        .light-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        /* 发光圆环 */
        .glow-ring {
            position: absolute;
            border-radius: 50%;
            border: 2px solid rgba(6, 182, 212, 0.15);
            animation: ringRotate 20s linear infinite;
        }

        .glow-ring:nth-child(1) {
            width: 600px;
            height: 600px;
            top: -200px;
            right: -100px;
            border-color: rgba(30, 64, 175, 0.2);
            animation-duration: 25s;
        }

        .glow-ring:nth-child(2) {
            width: 400px;
            height: 400px;
            bottom: -100px;
            left: -100px;
            border-color: rgba(6, 182, 212, 0.25);
            animation-duration: 18s;
            animation-direction: reverse;
        }

        .glow-ring:nth-child(3) {
            width: 300px;
            height: 300px;
            top: 40%;
            left: 20%;
            border-color: rgba(16, 185, 129, 0.2);
            animation-duration: 15s;
        }

        @keyframes ringRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 浮动光点 */
        .float-light {
            position: absolute;
            border-radius: 50%;
            animation: floatMove 10s ease-in-out infinite;
        }

        .float-light.blue {
            background: radial-gradient(circle, rgba(59, 130, 246, 0.6) 0%, transparent 70%);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.5), 0 0 40px rgba(59, 130, 246, 0.3);
        }

        .float-light.cyan {
            background: radial-gradient(circle, rgba(6, 182, 212, 0.6) 0%, transparent 70%);
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.5), 0 0 40px rgba(6, 182, 212, 0.3);
        }

        .float-light.green {
            background: radial-gradient(circle, rgba(16, 185, 129, 0.6) 0%, transparent 70%);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.5), 0 0 40px rgba(16, 185, 129, 0.3);
        }

        @keyframes floatMove {
            0%, 100% {
                transform: translateY(0) translateX(0) scale(1);
                opacity: 0.4;
            }
            25% {
                transform: translateY(-30px) translateX(20px) scale(1.2);
                opacity: 0.8;
            }
            50% {
                transform: translateY(-50px) translateX(-10px) scale(1);
                opacity: 0.6;
            }
            75% {
                transform: translateY(-20px) translateX(-20px) scale(0.9);
                opacity: 0.7;
            }
        }

        /* 闪烁星点 */
        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        #map {
            height: calc(100vh - 60px);
            width: 100%;
            border-radius: 16px;
            margin-top: 10px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
        }

        .legend {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .legend-title {
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 14px;
            color: var(--gradient-start);
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
        }

        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .sidebar {
            position: fixed;
            top: 80px;
            right: 20px;
            width: 300px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
            padding: 20px;
            z-index: 1000;
            max-height: calc(100vh - 120px);
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .dialect-card {
            cursor: pointer;
            transition: all 0.3s;
            border-left: 3px solid transparent;
            border-radius: 8px;
            padding: 10px;
        }

        .dialect-card:hover {
            background: rgba(6, 182, 212, 0.1);
            border-left-color: var(--gradient-mid);
        }

        .detail-btn {
            background: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-mid) 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(30, 64, 175, 0.3);
        }

        .detail-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(6, 182, 212, 0.4);
            color: white;
        }

        .search-box {
            position: fixed;
            top: 80px;
            left: 20px;
            z-index: 1000;
            width: 250px;
        }

        .search-box input {
            border-radius: 25px;
            padding: 10px 15px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
        }

        .search-box input:focus {
            box-shadow: 0 4px 15px rgba(6, 182, 212, 0.2);
            border-color: var(--gradient-mid);
        }

        /* 导航栏 */
        .navbar {
            background: rgba(255, 255, 255, 0.95) !important;
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1), 0 0 60px rgba(6, 182, 212, 0.15);
        }

        .navbar-brand {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 2.2rem !important;
            color: #0ea5e9 !important;
            letter-spacing: 0.1em;
            font-weight: 500;
        }
        
        .navbar-brand i {
            font-size: 1.5rem;
            color: var(--gradient-mid);
        }

        .nav-link {
            color: var(--text-light) !important;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--gradient-mid) !important;
        }
    </style>
{% endblock %}

{% block content %}
    <!-- 动态光效层 -->
    <div class="light-layer" id="light-layer">
        <!-- 发光圆环 -->
        <div class="glow-ring"></div>
        <div class="glow-ring"></div>
        <div class="glow-ring"></div>
    </div>

    <div class="search-box">
        <input type="text" class="form-control" id="searchInput" placeholder="搜索城市..." onkeyup="searchCity()">
    </div>

    <div id="map"></div>

    <div class="legend" style="position: fixed; bottom: 20px; left: 20px; z-index: 1000;">
        <div class="legend-title">濒危等级图例</div>
        <div class="legend-item"><div class="legend-color" style="background: green;"></div><span style="font-size: 12px;">安全</span></div>
        <div class="legend-item"><div class="legend-color" style="background: blue;"></div><span style="font-size: 12px;">较安全</span></div>
        <div class="legend-item"><div class="legend-color" style="background: orange;"></div><span style="font-size: 12px;">脆弱</span></div>
        <div class="legend-item"><div class="legend-color" style="background: red;"></div><span style="font-size: 12px;">濒危</span></div>
    </div>

    <div class="sidebar">
        <h4 class="mb-4" style="color: var(--primary-green);"><i class="fas fa-list"></i> 方言点列表</h4>
        <div id="dialectList"></div>
    </div>
{% endblock %}

{% block scripts %}
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 创建动态背景元素（优化性能）
        function createDynamicBackground() {
            // 地图页面禁用动态背景以保证地图流畅
        }
        
        window.addEventListener('load', createDynamicBackground);
    </script>
    <script>
        var map = L.map('map').setView([35.0, 105.0], 5);

        L.tileLayer('https://webrd02.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
            attribution: '高德地图',
            maxZoom: 18
        }).addTo(map);

        var markers = L.layerGroup().addTo(map);
        var allDialects = [];

        fetch('/api/dialects')
            .then(response => response.json())
            .then(data => {
                allDialects = data;
                renderList(data);

                data.forEach(function(item) {
                    var color = getColor(item.endanger_level);

                    var popupContent = `
                        <div style="width: 280px;">
                            <h3 style="margin: 0 0 10px 0; color: ${color}; border-bottom: 2px solid ${color}; padding-bottom: 8px;">
                                ${item.city}
                            </h3>
                            <div style="background: #f8f9fa; padding: 10px; border-radius: 6px; margin-bottom: 10px;">
                                <div style="margin-bottom: 5px;"><strong>方言区:</strong> ${item.dialect_area}</div>
                                <div style="margin-bottom: 5px;"><strong>省份:</strong> ${item.province}</div>
                            </div>
                            <div style="background: ${color}15; padding: 10px; border-radius: 6px; margin-bottom: 10px;">
                                <div style="margin-bottom: 5px;"><strong>使用人口:</strong> ${item.population_10k} 万人</div>
                                <div style="margin-bottom: 5px;"><strong>年轻人使用率:</strong> ${(item.youth_usage_rate * 100).toFixed(1)}%</div>
                                <div><strong>濒危等级:</strong> <span style="color: ${color}; font-weight: bold;">${item.endanger_level}</span></div>
                            </div>
                            <a href="/detail/${encodeURIComponent(item.city)}" class="detail-btn">
                                <i class="fas fa-info-circle"></i> 查看详细介绍
                            </a>
                        </div>
                    `;

                    var marker = L.circleMarker([item.latitude, item.longitude], {
                        radius: 10,
                        color: color,
                        fillColor: color,
                        fillOpacity: 0.8
                    }).addTo(markers);

                    marker.bindPopup(popupContent);
                    marker.on('click', function(e) {
                        highlightCard(item.city);
                    });

                    marker._cityName = item.city;
                });
            });

        function getColor(level) {
            switch(level) {
                case '安全': return 'green';
                case '较安全': return 'blue';
                case '脆弱': return 'orange';
                case '濒危': return 'red';
                default: return 'gray';
            }
        }

        function renderList(data) {
            var listHtml = '';
            data.forEach(function(item) {
                var color = getColor(item.endanger_level);
                listHtml += `
                    <div class="dialect-card p-3 mb-2 border rounded" onclick="zoomToMarker('${item.city}')">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <span class="font-weight-bold" style="color: ${color};">${item.city}</span>
                                <small class="text-muted d-block">${item.dialect_area}</small>
                            </div>
                            <span class="badge" style="background: ${color};">${item.endanger_level}</span>
                        </div>
                    </div>
                `;
            });
            document.getElementById('dialectList').innerHTML = listHtml;
        }

        function searchCity() {
            var searchText = document.getElementById('searchInput').value.toLowerCase();
            var filteredData = allDialects.filter(function(item) {
                return item.city.toLowerCase().includes(searchText) || 
                       item.dialect_area.toLowerCase().includes(searchText) ||
                       item.province.toLowerCase().includes(searchText);
            });
            renderList(filteredData);
        }

        function zoomToMarker(cityName) {
            markers.eachLayer(function(marker) {
                if (marker._cityName === cityName) {
                    map.setView(marker.getLatLng(), 10);
                    marker.openPopup();
                }
            });
            highlightCard(cityName);
        }

        function highlightCard(cityName) {
            document.querySelectorAll('.dialect-card').forEach(function(card) {
                card.classList.remove('border-primary', 'bg-primary', 'bg-opacity-10');
            });
            var activeCard = Array.from(document.querySelectorAll('.dialect-card')).find(function(card) {
                return card.textContent.includes(cityName);
            });
            if (activeCard) {
                activeCard.classList.add('border-primary', 'bg-primary', 'bg-opacity-10');
            }
        }
    </script>
{% endblock %}
